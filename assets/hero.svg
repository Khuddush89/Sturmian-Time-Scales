<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sturmian Time Scales</title>
  <desc id="desc">Purple, pink, and cyan gradient banner for a Python research toolkit. Exact grids, clear spectra, reproducible research.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.52" stop-color="#EC4899"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#8B5CF6" stop-opacity="0.22"/><stop offset="1" stop-color="#0D1020" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ADB5D8" opacity="0.15"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#0D1020"/>
  <rect width="1200" height="360" rx="24" fill="url(#dots)"/>
  <ellipse cx="930" cy="155" rx="340" ry="290" fill="url(#halo)"/>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="url(#brand)" stroke-opacity="0.4"/>
  <rect x="48" y="42" width="258" height="32" rx="16" fill="#211A3A" stroke="#8B5CF6" stroke-opacity="0.55"/>
  <circle cx="65" cy="58" r="4" fill="#06B6D4"/>
  <text x="80" y="63" fill="#D7C7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">PYTHON RESEARCH TOOLKIT</text>
  <text x="45" y="144" fill="url(#brand)" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Sturmian</text>
  <text x="46" y="207" fill="#F4F1FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Time Scales</text>
  <text x="48" y="247" fill="#B9C1DC" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Exact grids. Clear spectra. Reproducible research.</text>
  <rect x="48" y="282" width="312" height="33" rx="8" fill="#151B31"/>
  <text x="64" y="303" fill="#8EE0EC" font-family="DejaVu Sans Mono,monospace" font-size="12">gauge  /  spectra  /  zero counts</text>
  <g transform="translate(685 64)">
    <rect width="460" height="239" rx="17" fill="#11172C" stroke="#324063"/>
    <circle cx="21" cy="21" r="4" fill="#EC4899"/><circle cx="36" cy="21" r="4" fill="#8B5CF6"/><circle cx="51" cy="21" r="4" fill="#06B6D4"/>
    <text x="434" y="26" text-anchor="end" fill="#96A6C9" font-family="DejaVu Sans Mono,monospace" font-size="10">FINITE · DENSE · HYBRID</text>
    <path d="M32 122 H423" stroke="#2A3655" stroke-width="1"/>
    <path d="M36 149 C84 59 126 57 177 120" fill="none" stroke="#8B5CF6" stroke-width="4"/>
    <path d="M233 120 C285 182 325 182 382 82" fill="none" stroke="#06B6D4" stroke-width="4"/>
    <path d="M177 120 L233 120" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="5 6"/>
    <g fill="#0D1020" stroke-width="3">
      <circle cx="36" cy="149" r="6" stroke="#8B5CF6"/><circle cx="177" cy="120" r="6" stroke="#EC4899"/>
      <circle cx="233" cy="120" r="6" stroke="#EC4899"/><circle cx="382" cy="82" r="6" stroke="#06B6D4"/>
    </g>
    <text x="31" y="204" fill="#D7C7FF" font-family="DejaVu Sans Mono,monospace" font-size="13">x = E₀ y</text>
    <text x="430" y="204" text-anchor="end" fill="#8EE0EC" font-family="DejaVu Sans Mono,monospace" font-size="13">ν &gt; 0</text>
  </g>
  <rect x="48" y="342" width="1104" height="2" rx="1" fill="url(#brand)" opacity="0.6"/>
</svg>
