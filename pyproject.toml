[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sturmian-time-scales"
version = "0.1.0"
description = "Reproducible Sturmian spectra, gauge identities, and zero counts on time scales."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mahammad Khuddush"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "build>=1.2,<2", "PyYAML>=6,<7"]

[project.scripts]
sturmian = "sturmian.cli:main"

[project.urls]
Repository = "https://github.com/Khuddush89/Sturmian-Time-Scales"
Issues = "https://github.com/Khuddush89/Sturmian-Time-Scales/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: complete finite verification, including million-node counts"]
